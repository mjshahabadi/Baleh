<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Premium Bot</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .btn {
            background: #6366f1;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .price {
            color: #22c55e;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h2>🟣 Premium Bot</h2>

<div class="card">
    <h3>🔓 وضعیت اشتراک</h3>
    <p>❌ فعال نیست</p>
</div>

<div class="card">
    <h3>Pro Plan</h3>
    <p class="price">199,000 تومان</p>
    <p>✔ دسترسی کامل</p>
    <div class="btn">خرید اشتراک</div>
</div>

<div class="card">
    <h3>VIP Plan</h3>
    <p class="price">499,000 تومان</p>
    <div class="btn">خرید VIP</div>
</div>

</body>
</html>
